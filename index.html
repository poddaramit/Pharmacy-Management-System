:root[data-theme="dark"]{--bg:#10161d;--card:#18212b;--tx:#e6ebf1;--mu:#8b97a6;--ac:#2dd4bf;--bd:#2a3644;--rd:#f87171;--am:#fbbf24;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:17px;margin:0 12px 0 0;color:var(--ac)}nav{display:flex;gap:4px;flex-wrap:wrap}
nav button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 11px;border-radius:7px;cursor:pointer;font:inherit}
nav button.on,.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.d{color:var(--rd)}
main{max-width:1100px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}.grid .card{margin:0}
.k{color:var(--mu);font-size:12px}.v{font-size:22px;font-weight:600}h2{font-size:15px;margin:0 0 8px}a{color:var(--ac)}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:7px;padding:6px 8px;font:inherit;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:500;font-size:12px}
.tag{padding:1px 7px;border-radius:9px;font-size:11px;border:1px solid var(--bd)}.r{color:var(--rd)}.a{color:var(--am)}.g{color:var(--ac)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.note{color:var(--mu);font-size:12px}#msg{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:9}
@media(min-width:900px){body{display:grid;grid-template-columns:210px 1fr}header{flex-direction:column;align-items:stretch;height:100vh;position:sticky;top:0;border-right:1px solid var(--bd);border-bottom:0;padding:16px 12px}nav{flex-direction:column}nav button{text-align:left;padding:9px 12px}h1{margin:0 0 12px}}
@media print{body *{visibility:hidden}#inv,#inv *{visibility:visible}#inv{position:absolute;left:0;top:0;width:100%}.noprint{display:none!important}body,#inv .card{background:#fff!important;color:#000!important}}

const L=s.items.map(i=>t.splitTextToSize(i.name,W-2*m)),H=Math.max(80,64+L.reduce((a,l)=>a+l.length*4+4.5,0)+(s.rx?5:0));
const d=new J({unit:'mm',format:[W,H]});let y=11;
const ct=(x,z,b)=>{d.setFont('helvetica',b?'bold':'normal');d.setFontSize(z);d.text(x,W/2,y,{align:'center'});y+=z*.42+1.6};
const ln=()=>{d.setLineWidth(.2);d.line(m,y,W-m,y);y+=4.5};
const lr=(a,b,bd)=>{d.setFont('helvetica',bd?'bold':'normal');d.setFontSize(9);d.text(a,m,y);d.text(b,W-m,y,{align:'right'});y+=4.5};
const dt=new Date(s.date);
ct('PharmaCare',14,1);ct('Square Pharma medicines - Receipt',8);y+=1;ln();
lr('Invoice #'+s.id,dt.toLocaleDateString());lr('Time',dt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));lr('Customer',s.cust||'Walk-in');if(s.rx)lr('Prescription',s.rx);ln();
s.items.forEach((i,k)=>{d.setFont('helvetica','bold');d.setFontSize(9);L[k].forEach(x=>{d.text(x,m,y);y+=4});lr(i.qty+' x Tk '+i.price,'Tk '+(i.qty*i.price).toFixed(2))});
ln();const sub=s.items.reduce((a,i)=>a+i.qty*i.price,0);lr('Subtotal','Tk '+sub.toFixed(2));lr('Discount',s.disc+'%');lr('TOTAL','Tk '+s.total.toFixed(2),1);y+=3;ct('Thank you!',9);
const name=((s.cust||'').replace(/[\\/:*?"<>|]/g,'').trim()||'Customer')+"'s Medicines.pdf";
try{const dl=window.claude&&await window.claude.use('downloads');if(dl){await dl.save({filename:name,data:d.output('blob')});toast('Receipt PDF saved')}else d.save(name)}catch(e){if(!e||e.code!=='declined')toast('Could not save the PDF')}}
function addMed(){const v=i=>$(i).value.trim();if(!v('#b')||!v('#g')||!+v('#p'))return toast('Brand, generic and price are required');
 DB.meds.push({id:nid(DB.meds),form:v('#f')||'Tablet',brand:v('#b'),strength:v('#s'),generic:v('#g'),company:v('#c'),medex:'',price:+v('#p'),reorder:5,rx:$('#x').checked});toast('Medicine added');render()}
const FORMS=['Tablet (Extended Release)','Tablet (Delayed Release)','Tablet (Chewable)','Tablet (Orodispersible)','Powder for Suspension','Powder for Injection','Oral Suspension','Oral Solution','Oral Saline','Pediatric Drop','Injectable Solution','IV Injection or Infusion','IV Infusion','IM Injection','SC Injection','Inhalation Capsule','Inhalation Solution','Nasal Spray','Nasal Drop','Eye Drop','Ear Drop','Eye Ointment','Scalp Solution','Test strip','Glucometer','Suppository','Ointment','Capsule','Syrup','Suspension','Injection','Cream','Lotion','Solution','Shampoo','Powder','Sachet','Gel','Spray','Drop','Inhaler','Tablet'];
const FR=FORMS.map(f=>f.replace(/[()]/g,'\\$&')).join('|'),FRE=new RegExp('^('+FR+')$','i'),SFX=new RegExp('^(.*\\S)\\s+('+FR+')$','i');
function impMxOld(){const L=$('#mx').value.split('\n').map(x=>x.trim()).filter(Boolean);let b=[],n=0;
for(const l of L){if(/^(square.*|browse alphabetically|[a-z]|\d+|[‹›.…]+|thanks for using.*)$/i.test(l))continue;
const m=l.match(/৳\s*([\d,]+(?:\.\d+)?)/);if(!m){if(/:$/.test(l))continue;b.push(l);continue}
const price=+m[1].replace(/,/g,'');let nm='',fm='Tablet',r=[];
if(b.length>1&&FRE.test(b[1])){nm=b[0];fm=b[1];r=b.slice(2)}else if(b.length){const k=b[0].match(SFX);nm=k?k[1]:b[0];fm=k?k[2]:'Tablet';r=b.slice(1)}
b=[];if(!nm)continue;const st=r.length>1?r[0]:'',g=r.length>1?r.slice(1).join(' '):(r[0]||'');
if(DB.meds.some(x=>x.brand==nm&&x.strength==st&&x.form==fm))continue;
const id=nid(DB.meds);DB.meds.push({id,form:fm,brand:nm,strength:st,generic:g,company:'Square Pharmaceuticals PLC',medex:'',price,reorder:5,rx:RX.test(g)});
const bn='B'+(100+id);DB.batches.push({id:nid(DB.batches),med:id,no:bn,exp:'2030-12-30',qty:100,cost:+(price*.7).toFixed(2)});
DB.purchases.push({date:today(),sup:'Square Pharmaceuticals PLC',name:nm+' '+st+' ('+fm+')',no:bn,qty:100,cost:+(price*.7).toFixed(2)});n++}
toast(n+' new medicines added');render()}
function impMx(){const raw=$('#mx').value;if(raw.includes('৳')&&!/Pharmaceuticals PLC\.?\s*$/m.test(raw))return impMxOld();
const K=[];for(const l of raw.split('\n').map(x=>x.trim()).filter(Boolean)){if(/^thanks for using/i.test(l))break;if(/^(square pharmaceuticals plc\.?\s*)?available brand names$|^browse alphabetically$|^([a-z]\s+)*[a-z]$|^[‹›.…\s\d]+$/i.test(l))continue;K.push(l)}
const UN=/^(mg|mcg|gm|g|ml|iu|unit|units|billion|million|anti-xa|w\/w|w\/v|v\/v)\b/i;let n=0,sk=0,dp=0;
K.join(' ').split(/Square Pharmaceuticals PLC\.?/i).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean).forEach(c=>{
let fm,rest;const m=c.match(new RegExp('^('+FR+')(?:\\s*\\([^)]*\\))?\\s+(.*)$','i'));
if(m){fm=c.slice(0,c.length-m[2].length).trim();rest=m[2]}else{const i=c.indexOf(' ');fm=c.slice(0,i);rest=c.slice(i+1)}
const t=rest.split(' ');let a=-1;for(let i=1;i<t.length;i++)if(/^\(?\d/.test(t[i])){a=i;break}
if(a<0){sk++;return}
let e=a;while(e<t.length&&(/\d|^[+\/()%]/.test(t[e])||UN.test(t[e])))e++;
const nm=t.slice(0,a).join(' '),st=t.slice(a,e).join(' '),g=t.slice(e).join(' '),k=x=>x.brand.toLowerCase()+'|'+x.strength.toLowerCase().replace(/\s+/g,'');
const nw={id:nid(DB.meds),form:fm,brand:nm,strength:st,generic:g,company:'Square Pharmaceuticals PLC',medex:'',price:0,reorder:5,rx:RX.test(g)};
if(DB.meds.some(x=>k(x)==k(nw))){dp++;return}DB.meds.push(nw);n++});
toast(n+' new added (set price), '+dp+' already in list, '+sk+' skipped');render()}
function imp(){let n=0;$('#csv').value.split('\n').forEach(l=>{const a=l.split(',').map(x=>x.trim());if(a.length<6||!+a[5])return;DB.meds.push({id:nid(DB.meds),form:a[0],brand:a[1],strength:a[2],generic:a[3],company:a[4],medex:'',price:+a[5],reorder:5,rx:RX.test(a[3])});n++});toast(n+' medicines imported');render()}
let psel=0;
function pList(q){if(!q.trim())return'';return DB.meds.filter(m=>mt(m,q)).slice(0,12).map(m=>`<button class="btn" onclick="pPick(${m.id})">${esc(name(m))}</button>`).join('')||'<span class="note">No match</span>'}
function pSearch(v){psel=0;$('#psel').textContent='No medicine selected';$('#plist').innerHTML=pList(v)}
function pPick(id){psel=id;const m=med(id);$('#pms').value=m.brand+' '+m.strength;$('#plist').innerHTML='';$('#psel').innerHTML='Selected: <b>'+esc(name(m))+'</b> · MRP '+money(m.price);$('#pc').value=m.price}
function sold(id){return DB.sales.some(s=>s.items.some(i=>i.med==id))}
function exp3(){const d=new Date();d.setFullYear(d.getFullYear()+3);return d.toISOString().slice(0,10)}
function recv(){const id=psel,no=$('#pn').value.trim()||('B'+Date.now().toString().slice(-6)),e=$('#pe').value,q=+$('#pq').value,c=+$('#pc').value;
 if(!id)return toast('Search and select a medicine first');if(!e)return toast('Enter the expiry date');if(q<1||!c)return toast('Enter quantity and unit cost');if(e<today())return toast('Cannot receive an expired batch');
 DB.batches.push({id:nid(DB.batches),med:id,no,exp:e,qty:q,cost:c});DB.purchases.push({date:today(),sup:$('#ps').value||'—',name:name(med(id)),no,qty:q,cost:c});toast('Stock received');render()}
let lastDay=today();setInterval(()=>{const t=today();if(t!==lastDay){lastDay=t;if(tab==='Dashboard')render()}},20000);
const h=location.hash.slice(1);if(TABS.includes(h))tab=h;render();
</script></body></html>
